<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>FM27 — Maç Simülatörü</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
  h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
  .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: start; }
  .team-panel { background: #1e293b; border-radius: 12px; padding: 16px; }
  .team-panel h2 { color: #fbbf24; margin-bottom: 12px; font-size: 18px; }
  .section { margin-bottom: 16px; }
  .section-title { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .player-slot { background: #334155; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 8px; }
  .player-slot select { flex: 1; background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 4px; padding: 3px 6px; font-size: 12px; }
  .tactics { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
  .tactics label { font-size: 11px; color: #94a3b8; }
  .tactics select { width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 4px; padding: 4px; font-size: 12px; }
  .center-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .vs { font-size: 28px; color: #ef4444; font-weight: bold; margin-bottom: 20px; text-align: center; }
  .sim-btn { background: #10b981; color: white; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
  .sim-btn:hover { background: #059669; transform: scale(1.05); }
  .sim-btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
  .result { margin-top: 20px; background: #1e293b; border-radius: 12px; padding: 20px; max-width: 1400px; margin-left: auto; margin-right: auto; margin-top: 30px; }
  .result h2 { color: #38bdf8; margin-bottom: 16px; }
  .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .odds-cell { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
  .odds-cell .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
  .odds-cell .value { font-size: 24px; font-weight: bold; color: #10b981; margin-top: 4px; }
  .odds-cell .pct { font-size: 12px; color: #94a3b8; }
  .score-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .score-item { background: #0f172a; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; }
  .score-item .score { font-weight: bold; color: #fbbf24; }
  .team-selector { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .team-selector select { background: #0f172a; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
</style>
</head>
<body>
<h1>⚽ FM27 — Süper Lig Maç Simülatörü</h1>
<div class="team-selector">
  <select id="home-select"></select>
  <span>vs</span>
  <select id="away-select"></select>
  <button class="sim-btn" id="sim-btn">🎲 SİMÜLE ET (10.000)</button>
</div>
<div class="container">
  <div class="team-panel" id="home-panel"></div>
  <div class="center-panel"><div class="vs" id="vs-label">—</div></div>
  <div class="team-panel" id="away-panel"></div>
</div>
<div class="result" id="result" style="display:none;"></div>

<script src="browser.js?v=99"></script>
</body>
</html>
