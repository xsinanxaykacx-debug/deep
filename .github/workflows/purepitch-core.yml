name: PurePitch Core CI

on:
  push:
    branches:
      - feature/purepitch-core-isolated
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  pull_request:
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  workflow_dispatch:

jobs:
  purepitch-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/purepitch-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install package dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Golden determinism tests
        run: npm run test:golden -- --reporter=verbose
