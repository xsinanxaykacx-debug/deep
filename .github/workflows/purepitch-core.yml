name: PurePitch Core CI

on:
  push:
    branches:
      - feature/purepitch-core-isolated
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  pull_request:
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purepitch-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/purepitch-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/purepitch-core/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: TEMPORARY generate and print P0d-2b golden master
        run: |
          npm run golden:update
          cat test/golden/golden-master.json
      - name: Golden determinism and regression tests
        run: npm run test:golden -- --reporter=verbose
      - name: Physics unit tests
        run: npm run test -- --reporter=verbose
      - name: Security audit
        run: npm audit --audit-level=high
