name: PurePitch Core CI

on:
  push:
    branches:
      - feature/purepitch-core-isolated
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  pull_request:
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purepitch-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/purepitch-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/purepitch-core/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Regenerate golden master for P0e-2 verification
        run: npm run golden:update
      - name: Golden determinism and regression tests
        run: npm run test:golden -- --reporter=verbose
      - name: Commit verified golden master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/golden/golden-master.json
          git commit -m "test: P0e-2 tick-scoped RNG golden master" || exit 1
          git push
      - name: Physics unit tests
        run: npm run test -- --reporter=verbose
      - name: Security audit
        run: npm audit --audit-level=high
