name: PurePitch Core CI

on:
  push:
    branches:
      - feature/purepitch-core-isolated
      - feature/purepitch-minimal-football-slice
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  pull_request:
    paths:
      - "packages/purepitch-core/**"
      - ".github/workflows/purepitch-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purepitch-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/purepitch-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/purepitch-core/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Golden determinism and regression tests
        run: npm run test:golden -- --reporter=verbose
      - name: Physics unit tests
        run: npm run test -- --reporter=verbose
      - name: Security audit
        run: npm audit --audit-level=high

  benchmark:
    name: Benchmark (report only)
    runs-on: ubuntu-latest
    needs: [purepitch-core]
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/purepitch-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/purepitch-core/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run benchmark
        run: npm run benchmark
        continue-on-error: true
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/purepitch-core/benchmark-results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Add benchmark report to job summary
        if: always()
        run: |
          if [ -f benchmark-results.json ]; then
            echo "## PurePitch Benchmark (CI runner; indicative only)" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## PurePitch Benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "Benchmark report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
